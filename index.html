<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking · SoloQ Challenge</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0a0a0e',
          panel: '#101014',
          'panel-border': '#1f2024',
          accent: '#e8ff3d',
          'accent-dim': '#b8cc2f',
          win: '#34d67a',
          loss: '#ff4d6d',
          'text-dim': '#8b8b93',
          'text-dimmer': '#5c5c64',
          gold: '#ffc93d',
          silver: '#c9ccd1',
          bronze: '#d78b4c',
        },
        fontFamily: {
          author: ['Author', 'Inter', 'system-ui', 'sans-serif'],
        },
      }
    }
  }
</script>
<style>
  @font-face { font-family:"Author"; src:url("fonts/Author-Extralight.otf") format("opentype"); font-weight:200; font-display:swap; }
  @font-face { font-family:"Author"; src:url("fonts/Author-Light.otf") format("opentype"); font-weight:300; font-display:swap; }
  @font-face { font-family:"Author"; src:url("fonts/Author-Regular.otf") format("opentype"); font-weight:400; font-display:swap; }
  @font-face { font-family:"Author"; src:url("fonts/Author-Medium.otf") format("opentype"); font-weight:500; font-display:swap; }
  @font-face { font-family:"Author"; src:url("fonts/Author-Semibold.otf") format("opentype"); font-weight:600; font-display:swap; }
  @font-face { font-family:"Author"; src:url("fonts/Author-Bold.otf") format("opentype"); font-weight:700; font-display:swap; }
  @font-face { font-family:"Author"; src:url("fonts/Author-BoldItalic.otf") format("opentype"); font-weight:700; font-style:italic; font-display:swap; }
  * { box-sizing: border-box; }
  html, body { font-family: 'Author', 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  /* Filas de la tabla */
  tbody tr:hover { background: #161619; }
  td { height: 56px; vertical-align: middle; }
  /* Barras winrate */
  .vd-bar, .wl-bar { display: flex; gap: 3px; height: 5px; }
  .wl-bar { height: 6px; gap: 4px; }
  .bar-w { display: block; height: 100%; border-radius: 1px; background: rgba(52,211,153,0.85); }
  .bar-l { display: block; height: 100%; border-radius: 1px; background: rgba(251,113,133,0.85); }
  /* Scrollbar tabla mobile */
  .table-scroll { overflow-x: auto; }
  .table-scroll table { min-width: 860px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-bg text-white">

<div class="max-w-[1440px] mx-auto px-12 py-10 pb-20 max-md:px-4 max-md:py-6">

  <!-- HEADER -->
  <div class="flex items-end justify-between flex-wrap gap-5 mb-8">
    <div>
      <h1 class="text-6xl font-black tracking-tight leading-none mb-1 max-md:text-4xl">Ranking</h1>
      <div class="text-sm text-text-dim">
        <span class="text-accent font-bold">Última actualización:</span>
        <span id="updatedAgo">cargando…</span>
      </div>
    </div>
    <div class="flex items-center gap-3 bg-panel border border-panel-border rounded-xl px-5 py-3">
      <span class="text-accent text-xl">⏱</span>
      <span class="text-[11px] font-extrabold tracking-wide text-accent leading-tight max-w-[70px]">EL TORNEO<br>TERMINA EN</span>
      <div id="countdown" class="flex items-baseline gap-1 font-extrabold text-2xl">
        <span>--</span><span class="text-[13px] font-semibold text-text-dim mr-2">d</span>
        <span>--</span><span class="text-[13px] font-semibold text-text-dim mr-2">h</span>
        <span>--</span><span class="text-[13px] font-semibold text-text-dim mr-2">m</span>
        <span>--</span><span class="text-[13px] font-semibold text-text-dim">s</span>
      </div>
    </div>
  </div>

  <!-- PODIUM -->
  <div id="podium" class="grid grid-cols-3 gap-5 mb-9 max-md:grid-cols-1"></div>

  <!-- CONTROLS -->
  <div class="flex items-center gap-3 flex-wrap mb-4">
    <div id="eloTabs" class="flex gap-2">
      <button class="tab-btn bg-white text-bg font-bold text-[13px] px-4 py-2.5 rounded-lg" data-filter="todos">TODOS</button>
      <button class="tab-btn bg-panel border border-panel-border text-text-dim font-bold text-[13px] px-4 py-2.5 rounded-lg hover:text-white transition-colors" data-filter="high">HIGH ELO</button>
      <button class="tab-btn bg-panel border border-panel-border text-text-dim font-bold text-[13px] px-4 py-2.5 rounded-lg hover:text-white transition-colors" data-filter="low">LOW ELO</button>
    </div>
    <div class="flex items-center gap-2 bg-panel border border-panel-border rounded-lg px-3.5 py-2.5 min-w-[220px] text-text-dim">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar jugador"
        class="bg-transparent border-none outline-none text-white text-[13px] w-full placeholder:text-text-dim">
    </div>
    <button id="liveToggle" class="pill-btn bg-panel border border-panel-border text-text-dim font-bold text-[13px] px-3.5 py-2.5 rounded-lg flex items-center gap-1.5 cursor-pointer hover:text-white transition-colors">● LIVE</button>
    <button id="ingameToggle" class="pill-btn bg-panel border border-panel-border text-text-dim font-bold text-[13px] px-3.5 py-2.5 rounded-lg flex items-center gap-1.5 cursor-pointer hover:text-white transition-colors">● EN PARTIDA</button>
    <div class="flex-1"></div>
    <button class="bg-accent text-bg border-none font-extrabold text-[13px] px-4 py-2.5 rounded-lg cursor-pointer">TODOS</button>
    <button class="bg-panel border border-panel-border text-text-dim font-bold text-[13px] px-3.5 py-2.5 rounded-lg cursor-pointer">Stats: OP.GG ▾</button>
  </div>

  <!-- TABLE -->
  <div class="rounded-2xl overflow-hidden table-scroll">
    <table class="w-full border-collapse">
      <thead>
        <tr>
          <th data-sort="rank"  class="sort-th text-left text-[11px] tracking-wide text-text-dimmer font-bold px-4 py-4 cursor-pointer whitespace-nowrap select-none hover:text-text-dim">#</th>
          <th class="text-left text-[11px] tracking-wide text-text-dimmer font-bold px-4 py-4 whitespace-nowrap select-none">Streamer</th>
          <th class="text-left text-[11px] tracking-wide text-text-dimmer font-bold px-4 py-4 whitespace-nowrap select-none">Rol</th>
          <th data-sort="lp"       class="sort-th text-left text-[11px] tracking-wide text-text-dimmer font-bold px-4 py-4 cursor-pointer whitespace-nowrap select-none hover:text-text-dim">Elo</th>
          <th data-sort="winrate"  class="sort-th text-left text-[11px] tracking-wide text-text-dimmer font-bold px-4 py-4 cursor-pointer whitespace-nowrap select-none hover:text-text-dim">V / D</th>
          <th class="text-left text-[11px] tracking-wide text-text-dimmer font-bold px-4 py-4 whitespace-nowrap select-none">Racha</th>
          <th data-sort="lpchange" class="sort-th text-left text-[11px] tracking-wide text-text-dimmer font-bold px-4 py-4 cursor-pointer whitespace-nowrap select-none hover:text-text-dim">±LP</th>
          <th class="text-left text-[11px] tracking-wide text-text-dimmer font-bold px-4 py-4 whitespace-nowrap select-none">Shells</th>
          <th class="text-left text-[11px] tracking-wide text-text-dimmer font-bold px-4 py-4 whitespace-nowrap select-none">Stats</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="9" class="text-center py-16 text-text-dim">Cargando datos del ranking…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
